# Populate values before applying.
# kubectl create secret generic memobase-secret -n memobase \
#   --from-literal=DATABASE_USER=memobase \
#   --from-literal=DATABASE_PASSWORD=changeme \
#   --from-literal=DATABASE_NAME=memobase \
#   --from-literal=REDIS_PASSWORD=changeme \
#   --from-literal=ACCESS_TOKEN=changeme \
#   --from-literal=PROJECT_ID=default \
#   --from-literal=LLM_API_KEY=changeme
apiVersion: v1
kind: Secret
metadata:
  name: memobase-secret
  namespace: memobase
type: Opaque
stringData:
  DATABASE_USER: memobase
  DATABASE_PASSWORD: changeme
  DATABASE_NAME: memobase
  REDIS_PASSWORD: changeme
  ACCESS_TOKEN: changeme
  PROJECT_ID: default
  LLM_API_KEY: changeme
